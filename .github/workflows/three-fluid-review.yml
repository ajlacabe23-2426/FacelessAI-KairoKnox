name: Kairo Three Fluid Episodes - native 60fps private review
on:
  pull_request:
    paths:
      - 'video-engine/src/episodes/**'
      - 'video-engine/src/Root.tsx'
      - '.github/workflows/three-fluid-review.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate-fluid:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Remotion
        working-directory: video-engine
        run: npm install --no-audit --no-fund
      - name: Enforce continuous motion and type safety
        working-directory: video-engine
        run: npm run motion:check && npm run fluid:check && npm run typecheck
  render:
    needs: validate-fluid
    runs-on: ubuntu-latest
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        film: [NvidiaEconomyFluid60, AgentProgrammingFluid60, PromptEngineeringFluid60]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install FFprobe
        run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg
      - name: Install Remotion
        working-directory: video-engine
        run: npm install --no-audit --no-fund
      - name: Run two seconds of native-60fps motion
        working-directory: video-engine
        run: npx remotion render src/index.ts ${{ matrix.film }} out/smoke.mp4 --codec=h264 --scale=0.5 --frames=0-119 --concurrency=2
      - name: Render complete 1080p 60fps visual director cut
        working-directory: video-engine
        run: npx remotion render src/index.ts ${{ matrix.film }} out/${{ matrix.film }}_1080p60_VISUAL_REVIEW.mp4 --codec=h264 --concurrency=2 --crf=22
      - name: Export film poster
        working-directory: video-engine
        run: npx remotion still src/index.ts ${{ matrix.film }} out/${{ matrix.film }}_POSTER.png --frame=165
      - name: Verify native frame count and codec
        working-directory: video-engine
        env:
          COMPOSITION: ${{ matrix.film }}
        run: |
          python3 - <<'PY'
          import json,os,subprocess
          from pathlib import Path
          film=os.environ['COMPOSITION']
          path=Path('out')/(film+'_1080p60_VISUAL_REVIEW.mp4')
          info=json.loads(subprocess.check_output(['ffprobe','-v','error','-show_entries',
            'format=duration','-show_entries','stream=codec_type,codec_name,width,height,r_frame_rate,nb_frames',
            '-of','json',str(path)],text=True))
          video=next(x for x in info['streams'] if x['codec_type']=='video')
          assert video['codec_name']=='h264',video
          assert (video['width'],video['height'])==(1080,1920),video
          assert video['r_frame_rate']=='60/1',video
          assert int(video['nb_frames'])>3000,video
          assert path.stat().st_size>500000
          print(film,'PASS',video,'duration',info['format']['duration'],'bytes',path.stat().st_size)
          PY
      - name: Label draft honestly
        working-directory: video-engine
        run: |
          printf '%s\n' 'KAIRO FLUID V2 / PRIVATE VISUAL REVIEW' 'Native 1080x1920 / 60fps code-rendered.' 'NO spoken narration or speech-timed subtitles. NOT a posting master.' 'The user must approve all sources, captions, audio and media rights before posting.' > out/REVIEW_NOTES.txt
      - name: Save phone-viewable artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kairo-fluid-${{ matrix.film }}-visual-review
          path: |
            video-engine/out/${{ matrix.film }}_1080p60_VISUAL_REVIEW.mp4
            video-engine/out/${{ matrix.film }}_POSTER.png
            video-engine/out/REVIEW_NOTES.txt
          if-no-files-found: error
          retention-days: 14
