name: Kairo Fluidity Proofs - twelve seconds each
on:
  push:
    paths:
      - '.github/workflows/fluid-quick-proof.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  motion-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        film: [NvidiaEconomyFluid60, AgentProgrammingFluid60, PromptEngineeringFluid60]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Remotion
        working-directory: video-engine
        run: npm install --no-audit --no-fund
      - name: Verify motion architecture
        working-directory: video-engine
        run: npm run motion:check && npm run fluid:check && npm run typecheck
      - name: Render twelve-second 60fps fluidity proof
        working-directory: video-engine
        run: npx remotion render src/index.ts ${{ matrix.film }} out/${{ matrix.film }}_12s_60fps_proof.mp4 --codec=h264 --scale=0.5 --frames=0-719 --concurrency=2 --crf=21
      - name: Upload privately for phone review
        uses: actions/upload-artifact@v4
        with:
          name: fluidity-proof-${{ matrix.film }}
          path: video-engine/out/${{ matrix.film }}_12s_60fps_proof.mp4
          if-no-files-found: error
          retention-days: 14
