name: Kairo content intelligence checks

on:
  push:
    paths:
      - 'content_intelligence/**'
      - 'tests/test_content_intelligence.py'
      - '.github/workflows/content-intelligence.yml'
  pull_request:
    paths:
      - 'content_intelligence/**'
      - 'tests/test_content_intelligence.py'
      - '.github/workflows/content-intelligence.yml'

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -p 'test_content_intelligence.py' -v
      - run: python -m content_intelligence --help
