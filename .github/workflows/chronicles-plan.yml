name: Chronicles story plan checks
on:
  push:
    paths: ['docs/production/KC002_STORY_FIRST_PLAN.json', 'scripts/validate_chronicles_plan.py', 'tests/test_chronicles_plan.py', '.github/workflows/chronicles-plan.yml']
  pull_request:
    paths: ['docs/production/KC002_STORY_FIRST_PLAN.json', 'scripts/validate_chronicles_plan.py', 'tests/test_chronicles_plan.py', '.github/workflows/chronicles-plan.yml']
permissions:
  contents: read
jobs:
  story-plan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -p 'test_chronicles_plan.py' -v
      - run: python scripts/validate_chronicles_plan.py docs/production/KC002_STORY_FIRST_PLAN.json
